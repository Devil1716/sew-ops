name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate the database client
        run: npx prisma generate
        working-directory: apps/api
      - name: Type check the API
        run: npm run typecheck -w @sew-ops/api
      - name: Type check the website
        run: npm run typecheck -w @sew-ops/web
      - name: Dependency audit (production libraries, high and above)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f deploy/api.Dockerfile --target runtime -t sewops-api:ci .
      - name: Build the migration tools image
        run: docker build -f deploy/api.Dockerfile --target tools -t sewops-tools:ci .
      - name: Build the website image
        run: docker build -f deploy/web.Dockerfile -t sewops-web:ci .