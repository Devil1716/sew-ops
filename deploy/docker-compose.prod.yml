x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  api:
    image: ${API_IMAGE:-sewops-api:local}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      ALLOW_LOCALHOST_ORIGIN: ${ALLOW_LOCALHOST_ORIGIN:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  web:
    image: ${WEB_IMAGE:-sewops-web:local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # one-off jobs: docker compose run --rm migrate   (and the first-admin setup, see bootstrap-admin.sh)
  migrate:
    profiles: ["tools"]
    image: ${TOOLS_IMAGE:-sewops-tools:local}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      FACTORY_NAME: ${FACTORY_NAME:-}
      FACTORY_CODE: ${FACTORY_CODE:-}
      FACTORY_TZ: ${FACTORY_TZ:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["npx", "prisma", "migrate", "deploy"]

volumes:
  pgdata:
  caddy_data:
  caddy_config: